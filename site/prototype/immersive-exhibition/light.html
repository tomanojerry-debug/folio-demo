    <a class="ws-skip" href="#app">跳到内容</a>

        <a class="ws-brand" href="#top" data-nav="home" aria-label="Folio · 私人收藏馆首页">

        </a>

        <section class="ws-conversation-history" data-workspace-conversations aria-label="和 Tag 的对话"></section>
        <div class="ws-sidebar-footer">
          <button type="button" class="btn ws-button" data-variant="ghost" data-size="sm" data-workspace-settings aria-haspopup="dialog" aria-label="设置"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h4m4 0h6M3 10h8m4 0h2M3 15h2m4 0h8"/><circle cx="9" cy="5" r="2"/><circle cx="13" cy="10" r="2"/><circle cx="7" cy="15" r="2"/></svg><span>设置</span></button>

        </div>
      </aside>
      <main id="app" tabindex="-1"></main>
      <section id="workspace-conversation" data-workspace-conversation-host data-chat-controller aria-label="和 Tag 对话" tabindex="-1" hidden></section>
